<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Leetcode Tracker</title>
</head>
<body>
    <div class="container">
        <h1>LeetMetric</h1>
        <div class="user-container">
            <p>Enter Your Username:</p>
            <div class="user-input-container">
                <input type="text" placeholder="Enter Username" id="user-input">
                <button id="btn">Search</button>
            </div>  
        </div>
        <div class="stat-container">
            <div class="progress">
                <div class="easy circle">
                    <span id="easy-label"></span>
                    Easy
                </div>
                <div class="medium circle">
                    <span id="medium-label"></span>
                    Medium
                </div>
                <div class="hard circle">
                    <span id="hard-label"></span>
                    Hard
                </div>
            </div>
        </div>
        <div class="card-container">
        
       </div>
    </div>
    

   <script src="script.js"></script>
</body>
</html>
